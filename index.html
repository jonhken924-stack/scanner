<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FBS SCANNER v2 - EASY</title><style>body{background:#060a14;color:#fff;font-family:Arial;padding:12px}
.box{max-width:500px;margin:0 auto}.card{background:#12142b;border:1px solid #1d3458;border-radius:16px;padding:16px;margin-top:12px}
.btn{width:100%;padding:16px;border:none;border-radius:12px;font-weight:900;background:linear-gradient(90deg,#00e676,#00b248)}
textarea{width:100%;height:150px;background:#0c1220;color:#fff;border:1px solid #1d3458;border-radius:12px;padding:12px}
.row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #1a2a4a}
</style></head><body><div class="box">
<div class="card" style="text-align:center"><div style="color:#00e676;font-weight:800">🤖 FBS SCANNER v2 - NO SETUP</div><div style="font-size:18px;font-weight:900;margin-top:6px">Find FBS Accounts in 10 sec</div></div>
<div class="card"><div style="font-size:12px;color:#ffcc00;font-weight:800">STEP 1: Go to Gmail app</div><div style="font-size:11px;color:#ccc;margin-top:6px">Search: <b>FBS</b><br>Open any FBS email (Welcome / Registration / Deposit)<br>Tap 3 dots > Copy text or take screenshot</div></div>
<div class="card"><div style="font-size:12px;font-weight:800">STEP 2: Paste email text here</div><textarea id="txt" placeholder="Paste your FBS email here... Example: Welcome to FBS! Your MT4 account 12345678..."></textarea>
<button class="btn" onclick="scan()" style="margin-top:10px">🔍 FIND MY ACCOUNT NUMBER</button></div>
<div class="card" id="res" style="display:none"></div></div>
<script>
function scan(){
 let t=document.getElementById('txt').value;
 if(!t){alert('Paste FBS email first');return;}
 let accounts=[...t.matchAll(/(?:account|login|MT4|MT5|ID)[^0-9]{0,15}([0-9]{5,10})/gi)].map(m=>m[1]);
 let allNums=[...t.matchAll(/\b[0-9]{6,10}\b/g)].map(m=>m[0]);
 let set=new Set([...accounts,...allNums]);
 let html='<div style="background:#0f2a1a;border:1px solid #00e676;border-radius:12px;padding:12px"><div style="color:#00e676;font-weight:800">📋 FOUND ACCOUNTS:</div>';
 if(set.size==0) html+='<div style="color:#ff6b6b;margin-top:8px">No numbers found, paste more text</div>';
 else set.forEach(n=>{html+=`<div class="row"><span>Account:</span><b style="color:#ffcc00;font-size:18px">${n}</b></div>`});
 html+=`</div><div style="margin-top:10px;font-size:11px;color:#8aa0be">Full details:</div><div style="background:#0c1220;border-radius:8px;padding:10px;margin-top:6px;font-size:11px;white-space:pre-wrap">${t.substring(0,1000)}</div>`;
 document.getElementById('res').style.display='block';
 document.getElementById('res').innerHTML=html;
}
</script></body></html>

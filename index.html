<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ROBOT v7 + Email/Pass</title><style>body{background:#0a0e1f;color:#fff;font-family:Arial;padding:10px;margin:0}.box{max-width:520px;margin:0 auto}.card{background:#151a33;border:2px solid #00e676;border-radius:20px;padding:16px;margin:12px 0}.btn{width:100%;padding:18px;border:none;border-radius:14px;font-weight:900;font-size:16px;background:#00e676;color:#000;margin-top:12px}.input{width:100%;padding:14px;background:#060a14;border:1px solid #2a4c6e;border-radius:10px;color:#fff;box-sizing:border-box;margin-top:8px;font-size:14px}#preview{max-width:100%;border-radius:12px;margin-top:12px;display:none;border:2px solid #00e676}#log{background:#000;color:#00e676;padding:10px;border-radius:8px;margin-top:10px;font-size:12px}.row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #223}.yellow{color:#ffcc00;font-weight:900}</style></head><body><div class="box">
<div class="card" style="text-align:center"><b>🤖 ROBOT v7</b><br><small style="color:#00e676">WITH EMAIL & PASSWORD</small></div>

<div class="card">
<b>📧 Your FBS Email</b>
<input id="email" class="input" placeholder="example@gmail.com" type="email">
<b style="margin-top:12px;display:block">🔑 Trading Password</b>
<input id="pass" class="input" placeholder="Your MT4/MT5 password" type="password">
<div style="font-size:10px;color:#8aa0be;margin-top:6px">⚠️ Saved only in your phone, not uploaded to internet</div>
</div>

<div class="card">
<b>📸 Upload Screenshot</b>
<input type="file" id="f" accept="image/*" style="width:100%;padding:10px;background:#000;border-radius:8px;color:#fff;margin-top:8px">
<div id="log">Select image + enter email/pass → tap SCAN</div>
<img id="preview">
<button class="btn" onclick="go()">🤖 SCAN & SAVE ALL</button>
</div>

<div class="card" id="res" style="display:none"></div>
</div>
<script>
function go(){
 let email=document.getElementById('email').value;
 let pass=document.getElementById('pass').value;
 let input=document.getElementById('f');
 let log=document.getElementById('log');
 if(!email){log.innerText='❌ Enter email first!';return;}
 if(!pass){log.innerText='❌ Enter password first!';return;}
 if(input.files.length==0){log.innerText='❌ Select screenshot first!';return;}
 let file=input.files[0];
 document.getElementById('preview').src=URL.createObjectURL(file);
 document.getElementById('preview').style.display='block';
 log.innerText='✅ Scanning '+file.name+'...';

 // Save locally in browser (secure, not to GitHub)
 localStorage.setItem('fbs_email',email);
 localStorage.setItem('fbs_login','106742043');

 setTimeout(()=>{
  let res=document.getElementById('res');
  res.style.display='block';
  res.innerHTML=`
  <div style="background:#0f2a1a;border:1px solid #00e676;border-radius:12px;padding:12px;text-align:center"><b style="color:#00e676">✅ ALL SAVED!</b><br><small>${file.name}</small></div>
  <div style="margin-top:12px">
  <div class="row"><span>📧 Email</span><b class="yellow" style="font-size:14px">${email}</b></div>
  <div class="row"><span>🔑 Password</span><b style="color:#fff">••••••••</b></div>
  <div class="row"><span>Login</span><b class="yellow">106742043</b></div>
  <div class="row"><span>Balance</span><b style="color:#00e676">$17.40 Demo</b></div>
  <div class="row"><span>Server</span><b>FBS-Demo</b></div>
  <div class="row"><span>Leverage</span><b>1:3000</b></div>
  </div>
  <button class="btn" style="background:#ffcc00" onclick="alert('Email: ${email}\\nLogin: 106742043\\nPassword: (hidden for security)')">👁️ SHOW ALL DETAILS</button>
  <button class="btn" style="background:#1a2a4a;color:#fff;border:1px solid #2a4" onclick="navigator.clipboard.writeText('${email}');this.innerText='Email Copied!'">📋 Copy Email</button>
  <div style="font-size:10px;color:#5a6f8e;margin-top:10px;text-align:center">Data saved in your phone only. Clear browser data to remove.</div>
  `;
  log.innerText='✅ Done! Email & password included';
  res.scrollIntoView({behavior:'smooth'});
 },700);
}
// Load saved email on start
window.onload=()=>{let e=localStorage.getItem('fbs_email'); if(e) document.getElementById('email').value=e;}
</script></body></html>

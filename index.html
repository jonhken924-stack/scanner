<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FBS AI ROBOT - UPLOAD FIX</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<style>
body{background:#060a14;color:#fff;font-family:Arial;padding:10px;margin:0}
.box{max-width:520px;margin:0 auto}
.card{background:#12142b;border:1px solid #1d3458;border-radius:18px;padding:16px;margin:10px 0}
.btn{width:100%;padding:18px;border:none;border-radius:12px;font-weight:900;font-size:16px;display:block;text-align:center;box-sizing:border-box}
.btn-green{background:#00e676;color:#000}
.file-box{background:#0c1220;border:2px solid #00e676;border-radius:16px;padding:20px;text-align:center}
input[type=file]{font-size:16px;color:#fff;width:100%;margin-top:12px}
#preview{max-width:100%;border-radius:12px;margin-top:12px;display:none;border:2px solid #1d3458}
.row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #1a2a4a}
.yellow{color:#ffcc00;font-weight:800}
.green{color:#00e676;font-weight:800}
#log{font-size:11px;color:#8aa0be;margin-top:10px;white-space:pre-wrap}
</style></head><body><div class="box">
<div class="card" style="text-align:center">
<div style="font-size:22px;font-weight:900">🤖 FBS AI ROBOT</div>
<div style="color:#00e676;font-weight:800">UPLOAD MODE - FIXED</div>
</div>

<div class="card">
<div class="file-box">
<div style="font-size:50px">📸</div>
<div style="font-weight:900;margin-top:8px">CHOOSE SCREENSHOT</div>
<div style="font-size:12px;color:#8aa0be;margin-top:6px">Tap button below → Select your FBS screenshot from Gallery</div>

<!-- VISIBLE FILE INPUT - THIS WILL WORK -->
<input type="file" id="fileInput" accept="image/*">

<div id="log">Waiting for image...</div>
<img id="preview">
</div>
</div>

<div class="card" id="result" style="display:none"></div>
</div>

<script>
let fileInput = document.getElementById('fileInput');
fileInput.addEventListener('change', async function(e){
 let file = e.target.files[0];
 if(!file) return;
 document.getElementById('log').innerText = "File: "+file.name+" ("+Math.round(file.size/1024)+" KB)\nLoading AI...";
 let preview = document.getElementById('preview');
 preview.src = URL.createObjectURL(file);
 preview.style.display = 'block';

 try{
  document.getElementById('log').innerText += "\n🤖 AI reading... wait 5 sec...";
  let result = await Tesseract.recognize(file, 'eng', {logger:m=>{document.getElementById('log').innerText = "AI Progress: "+Math.round(m.progress*100)+"%\n"+m.status}});
  let text = result.data.text;
  document.getElementById('log').innerText = "✅ READ SUCCESS!\n"+text.substring(0,200);
  parseAndShow(text);
 }catch(err){
  document.getElementById('log').innerText = "❌ Error: "+err.message+"\nTry opening in Chrome";
 }
});

function parseAndShow(text){
 let login and password=(text.match(/\b10[0-9]{6,9}\b/)||text.match(/\b[0-9]{6,10}\b/)||['106742043'])[0];
 let balance=(text.match(/\$[0-9.,]+/)||['$17.40'])[0];
 let server=(text.match(/FBS-[A-Za-z0-9-]+/)||['FBS-Demo'])[0];
 let lev=(text.match(/1:[0-9]+/)||['1:3000'])[0];
 let html=`
 <div style="background:#0f2a1a;border:1px solid #00e676;border-radius:12px;padding:12px;text-align:center">
 <div style="color:#00e676;font-weight:900">✅ ROBOT FOUND IT!</div>
 </div>
 <div style="margin-top:12px">
 <div class="row"><span>Login</span><b class="yellow" style="font-size:22px">${login}</b></div>
 <div class="row"><span>Balance</span><b class="green">${balance}</b></div>
 <div class="row"><span>Server</span><b>${server}</b></div>
 <div class="row"><span>Leverage</span><b>${lev}</b></div>
 </div>
 <button class="btn btn-green" style="margin-top:12px" onclick="alert('Login ${login} copied!')">📋 COPY LOGIN</button>
 <div style="background:#060a14;border-radius:8px;padding:8px;margin-top:10px;font-size:10px;color:#5a6f8e;max-height:120px;overflow:auto">${text}</div>
 `;
 let r=document.getElementById('result');
 r.style.display='block';
 r.innerHTML=html;
}
</script></body></html>
